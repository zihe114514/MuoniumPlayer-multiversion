# Gradle
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
# fabric-loom 1.17.19 要求 Gradle 守护进程 JVM >= 21（实测报错原文：Dependency requires at least JVM runtime version 21）。
org.gradle.java.home=C:/Users/24914/.jdks/ms-21.0.12.1

# Fabric Properties
minecraft_version=1.21.1
# 共享源码统一用 Mojang 官方名（mojmap），yarn 不再参与构建：
# NeoForge 只有 mojmap 一种命名，而 architectury-loom 的 yarn-mappings-patch-neoforge
# 最高只到 1.21+build.6，覆盖不到本仓的 1.21.11 / 26.2。
# Fabric 侧用 loom.officialMojangMappings()，NeoForge 侧由 ModDevGradle 直接给官方名。
# 开发/编译期使用的 Loader 版本（保持较新，仅影响本地 runClient 与编译类路径）。
loader_version=0.19.3
# 运行期最低要求，写入 fabric.mod.json 的 depends.fabricloader。
# 下限 = 0.15.11，这是本 mod 在 1.21.1 上能支持的真实下界，不是保守取值：
#   * 本 mod 自己只用 ClientModInitializer + mixin(minVersion 0.8 / JAVA_21) + access widener(无条目)，
#     这些能力在 0.15.x 上全都齐备（0.15.11 带 sponge-mixin 0.13.3+mixin.0.8.5，实测认 JAVA_21）；
#   * 真正卡下界的是硬依赖的 fabric-api：0.116.15+1.21.1 的根 fabric.mod.json 与它内嵌的
#     49 个模块无一例外都写 depends fabricloader >=0.15.11（已解包逐个核对）。
#     再往下放宽只会把「装不上」变成「装上了但 API 缺失」这种更难排查的失败。
# 0.15.11 已用 runClient 实测启动过（见 docs/PORTING-1.21.1-STATUS.md 第八节）。
loader_min_version=0.15.11
# 发布元数据使用的最低 NeoForge 版本；开发构建仍用上面的 neoforge_version。
neoforge_min_version=21.1.0
# Kotlin for Forge 最低支持版本；构建期也用这个版本编译，避免误用更新 API。
kotlinforforge_version=5.4.0
# Fabric 侧 Kotlin 运行时最低支持版本。
fabric_language_kotlin_version=1.13.12+kotlin.2.4.0

# Mod Properties
mod_version=1.5.0
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
fabric_version=0.116.15+1.21.1
# 代理（用户指定 127.0.0.1:7890）：maven.fabricmc.net / Mojang libraries 直连不稳。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# libraries.minecraft.net 直连 200 且更快，故留在白名单里。
# resources.download.minecraft.net（downloadAssets 的对象存储）同样必须直连：走 7890 代理时
# 抽风式失败（实测同一批 3 个对象里第 3 个 curl 返回 000/超时），Loom 直接抛 DownloadException。
# maven.fabricmc.net 本轮实测反过来：直连超时（curl 21s timeout），走 7890 代理 200，
# 所以 1.20.1 那份配置里的 maven.fabricmc.net 白名单条目在这里必须去掉。
# maven.minecraftforge.net / maven.neoforged.net 也必须直连：走 7890 代理时 curl -I 三次里
# 有两次是 000（连接被中断），直连稳定 200 且约 1s。走代理会让 :forge:createMinecraftArtifacts
# 抽风式报 "Remote host terminated the handshake"。
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|resources.download.minecraft.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|resources.download.minecraft.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io

# 显式登记本机 JDK，避免 toolchain 自动探测失败。
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-17,C:/Users/24914/.jdks/ms-21.0.12.1

# Skija 原生库平台。开发期只打本机平台以保持构建速度；
# 发布时改成同时声明四个（windows-x64 / linux-x64 / macos-x64 / macos-arm64）。
skija_natives=windows-x64

# ==================== NeoForge ====================
# 21.1.249 是 1.21.1 线的最新 release（maven.neoforged.net/releases/net/neoforged/neoforge）。
# mods.toml 里的 versionRange 下限就用这个值，不虚报兼容性。
neoforge_version=21.1.249
