plugins {
    id 'fabric-loom' version '1.17.20'
}

base {
    // 产物名带上 Minecraft 版本，这样四个版本工程的 8 个 jar 平铺到一个 dist/ 里不会撞名，
    // 用户下载后也一眼看出这个 jar 是给哪个版本、哪个加载器的：MuoniumPlayer-<mc>-<loader>-<modver>.jar
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-fabric"
}

loom {
    // 客户端专用 mod（原 Forge 侧 clientSideOnly = true）：
    // 不启用 splitEnvironmentSourceSets，全部代码留在 main，与共享源树目录结构一一对应。
    accessWidenerPath = file('src/main/resources/muoniumplayer.accesswidener')

    // 移植期验收辅助：设了 MU_QUICKPLAY=<存档文件夹名> 就直接进存档，
    // 不用在标题界面盲点鼠标（合成按键只在有焦点的窗口生效，标题界面点起来很不稳）。
    runs {
        client {
            def quickPlay = System.getenv('MU_QUICKPLAY')
            if (quickPlay) {
                programArgs '--quickPlaySingleplayer', quickPlay
            }
        }
    }
}

// 共享代码与资源在上一级目录，两个加载器子工程各自挂同一份，绝不复制。
//
// ModernUI 面板实现放在 external/modernui/java —— 它**不能**进 rootProject 的 src/main/java：
// 那份是四棵树共用的，而 ModernUI 按 Minecraft 版本发版（26.2 / 1.21.11 根本没有对应构件），
// 共享源一旦 import icyllis.modernui 就把另外几棵树一起编挂。
// HudExternalUiStaticTest 里有一条断言专门守这件事。
def modernUiEnabled = !project.hasProperty('skipModernUi')

sourceSets {
    main {
        java.srcDirs = [
                'src/main/java',                                       // Fabric 外壳
                rootProject.file('../muonium-common/src/main/java'),   // 五树共享主体（版本中立）
                rootProject.file('src/main/java'),                     // 本树版本差异层（compat / mixin / 功能集）
                rootProject.file('../mpparty-common/src/main/java')    // 一起听共用源码
        ]
        if (modernUiEnabled) {
            java.srcDirs += rootProject.file('external/modernui/java') // ModernUI 版 HUD 设置面板
        }
        resources.srcDirs = [
                'src/main/resources',                                  // fabric.mod.json / accesswidener / mixins
                rootProject.file('../muonium-common/src/main/resources'), // 五树共享资源（字体、纹理、svg、lx、automix）
                rootProject.file('src/main/resources')                 // 本树资源（lang 随版本 API 变动）
        ]
    }
    test {
        java.srcDirs = [
                rootProject.file('../muonium-common/src/test/java'),   // 五树共享测试
                rootProject.file('src/test/java')                      // 本树版本差异测试
        ]
    }
}

// repo.maven.apache.org 在本机既不能直连（connect timeout），走 7890 代理时 Gradle 侧
// 也会 "Remote host terminated the handshake"（curl 同一 URL 走代理却是 200，原因未查明）。
// 阿里云公共仓库直连可用且已实测含 org.lwjgl:3.3.1 全部 classifier，故把所有
// Maven Central 仓库（含 Loom 自己注入的 mavenCentral()）统一改写到阿里云。
def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org', 'repo.maven.org'] as Set
def retargetCentral = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url != null && centralHosts.contains(repo.url.host)) {
        repo.url = 'https://maven.aliyun.com/repository/public'
    }
}
repositories.all(retargetCentral)
buildscript.repositories.all(retargetCentral)

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/google' }
    // libs/ 里的本地 jar 必须以「模块」形式出现，否则 Loom 的 include（Jar-in-Jar）
    // 会报 "not a module component and has no capabilities"（file 依赖没有坐标）。
    // flatDir 按 <name>-<version>.jar 匹配，group 任意。
    flatDir { dirs rootProject.file('libs') }
    // ModernUI 只在这里发布，且版本号与 CurseForge/Modrinth 上的不同（上游 README 明确要求走这个仓库）。
    maven {
        name 'IzzelAliz Maven'
        url 'https://maven.izzel.io/releases/'
        content { includeGroup 'icyllis.modernui' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 共享源码统一用 Mojang 官方名（mojmap），这样同一份 src/ 也能编进 NeoForge 侧。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Loom 的 include（Jar-in-Jar）：Loader 为每个嵌套 jar 建独立的类加载视图，
    // 天然避免与 MC / 其它 mod 自带库撞版本。NeoForge 侧没有等价机制，
    // 那边用 shadow 把同一批库直接塞进 jar（见 neoforge/build.gradle）。
    implementation include('com.google.zxing:core:3.5.3')
    implementation include('org.mozilla:rhino:1.7.15')
    implementation include('com.google.code.gson:gson:2.11.0')
    implementation include('net.java.dev.jna:jna:5.14.0')
    implementation include('net.java.dev.jna:jna-platform:5.14.0')
    implementation include('muoniumplayer.libs:music-api:0.1.1')

    // ==================== Skija（渲染层）====================
    // Kotlin 运行时由 Fabric Language Kotlin 统一提供，不再随本 mod 打包。
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    implementation include('io.github.humbleui:skija-shared:0.143.17')
    implementation include('io.github.humbleui:types:0.2.0')
    // 开发期 runClient 用：只进运行时类路径，不进成品 jar（成品全平台走伴生包自动下载）
    runtimeOnly 'io.github.humbleui:skija-windows-x64:0.143.17'
    compileOnly 'org.jetbrains:annotations:20.1.0'

    // ==================== ModernUI（HUD 设置面板的可选外部渲染层）====================
    // 全部 compileOnly：成品 jar 里不含 ModernUI 一个字节，玩家装了才生效、没装零影响，
    // 也满足它的 LGPL-3.0（库必须可被用户替换，见 docs/接入ModernUI可行性-HUD设置面板.md §四）。
    // 面板实现在 external/modernui/java；探测与转交在共享的 ModernUiHudBridge。
    // 构建时拿不到这个仓库可以用 -PskipModernUi=true 跳过，代价只是这一棵树没有面板。
    if (modernUiEnabled) {
        modCompileOnly("icyllis.modernui:ModernUI-Fabric:${project.minecraft_version}-3.13.0.1")
        compileOnly('dev.icyllis:modernui-core:3.13.0') {
            exclude group: 'org.slf4j', module: 'slf4j-api'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
            exclude group: 'com.google.code.findbugs', module: 'jsr305'
            exclude group: 'org.jetbrains', module: 'annotations'
        }
        compileOnly 'icyllis.modernui:ModernUI-Markflow:3.13.0'
    }

    // 离线探针（不需要 GL / 不需要启动客户端就能跑的断言）。
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // 离线光栅测试要在 JUnit 里真跑 Skia：原生库已不随主包内置，
    // 这里只进测试类路径，不会进成品 jar
    testImplementation 'io.github.humbleui:skija-windows-x64:0.143.17'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // 测试 JVM 不许真去下载伴生包：断网/超时会拖垮整轮测试
    systemProperty 'muonium.skija.autoDownload', 'false'
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_min_version', project.loader_min_version
    inputs.property 'fabric_language_kotlin_version', project.fabric_language_kotlin_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'loader_min_version': project.loader_min_version,
                'fabric_language_kotlin_version': project.fabric_language_kotlin_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // 源码含中文注释与字符串字面量，默认 GBK 会破坏 UI/歌词文案。
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
    // 移植期间需要一次看到全部错误，javac 默认只报 100 条。
    it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// 移植期辅助：把编译类路径导出到文件，便于用 javap 实测 API 签名（禁止凭记忆写 API）。
tasks.register('dumpCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def cp = sourceSets.main.compileClasspath
    outputs.file(out)
    doLast {
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = cp.asPath
    }
}
