# NeoForge 侧的 mod 元数据，对应 Fabric 的 fabric.mod.json。
modLoader = "javafml"
loaderVersion = "[1,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/zihe114514/MuoniumPlayer-multiversion/issues"

[[mods]]
modId = "muonium"
version = "${version}"
displayName = "MuoniumPlayer"
authors = "云杉, 心事抱抱, N0ne, eyz2021, Chryui (Cherry7593)"
description = '''
Minecraft music client mod: 8 sources (NetEase / QQ / KuGou / Bilibili / Qishui / YouTube Music / Spotify / GD), word-by-word lyrics, Dynamic Island, Automix crossfade, listen-together rooms. Client-only.
'''
displayURL = "https://melodifymc.cc.cd/"
# 方形图标（128x128）用 iconFile。旧的 logoFile 在 NeoForge 里已废弃，留着会让
# 每次启动卡在「Warnings while loading mods」界面，要玩家手点才能继续：
#   Mod muonium uses the deprecated `logoFile` property; change to `bannerFile`
#   and/or (for square icons) `iconFile`
# bannerFile 是横幅（宽图）专用，我们的图是方形，所以用 iconFile。
# 注意：Forge 1.20.1 的 mods.toml 只认 logoFile（那里没有这两个新字段），
# 所以 1.20.1 那条车道保持原样，不要跟着改。
iconFile = "assets/muonium/icon.png"

# 客户端专用：装到服务端上不需要、也不应该加载。
[[dependencies.muonium]]
    modId = "neoforge"
    mandatory = true
    type = "required"
    versionRange = "[${neoforge_min_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.muonium]]
    modId = "kotlinforforge"
    mandatory = true
    type = "required"
    versionRange = "[${kotlinforforge_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.muonium]]
    modId = "minecraft"
    mandatory = true
    type = "required"
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "CLIENT"

# 帧末合成用的 mixin（与 Fabric 侧共用同一份 com.muoniumplayer.mixin.FramebufferMixin 源码）。
# NeoForge 运行期本来就是官方名，不需要 refmap；Fabric 侧的 refmap 由 Loom 自己生成。
[[mixins]]
    config = "muonium.mixins.json"