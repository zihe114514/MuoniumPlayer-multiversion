plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

base {
    // 产物名带上 Minecraft 版本，这样四个版本工程的 8 个 jar 平铺到一个 dist/ 里不会撞名，
    // 用户下载后也一眼看出这个 jar 是给哪个版本、哪个加载器的：MuoniumPlayer-<mc>-<loader>-<modver>.jar
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-fabric"
}

loom {
    // 客户端专用 mod（原 Forge 侧 clientSideOnly = true）：
    // 不启用 splitEnvironmentSourceSets，全部代码留在 main，与共享源树目录结构一一对应。
    accessWidenerPath = file('src/main/resources/muoniumplayer.accesswidener')

    // 开发环境（runClient）日志降噪：见根目录 log4j-dev-noise.xml 的说明。
    // Loom 会把自己的配置和这里追加的配置以逗号拼成 -Dlog4j.configurationFile，log4j2 自动合并。
    log4jConfigs.from(rootProject.file('log4j-dev-noise.xml'))

    // 移植期验收辅助：设了 MU_QUICKPLAY=<存档文件夹名> 就直接进存档，
    // 不用在标题界面盲点鼠标（合成按键只在有焦点的窗口生效，标题界面点起来很不稳）。
    runs {
        client {
            def quickPlay = System.getenv('MU_QUICKPLAY')
            if (quickPlay) {
                programArgs '--quickPlaySingleplayer', quickPlay
            }
        }
    }
}

// 共享代码与资源在上一级目录，两个加载器子工程各自挂同一份，绝不复制。
//
// ModernUI 面板实现在 external/modernui/java —— 与 1.21.1 那棵树同构，但**两份源码不通用**：
// 本树编译期用的是社区分支 mVUS 的构件（上游止于 26.1.2 与 1.21.8，1.21.9~11 只有这个分支有），
// 它跟的是 ModernUI 3.12 那一代 API，与 1.21.1 那份的 3.13 只差一个方法名
// （ClampingScrollView.setMaxWidth ↔ setChildMaxWidth），细节写在那个文件的调用点注释里。
// 共享 src 一旦 import icyllis.modernui 就会把另外三棵树一起编挂，所以这里绝不能挪进 src/main/java；
// HudExternalUiStaticTest 有断言守这件事。
def modernUiEnabled = !project.hasProperty('skipModernUi')

sourceSets {
    main {
        java.srcDirs = [
                'src/main/java',                                       // Fabric 外壳
                rootProject.file('src/main/java'),                     // 共享主体
                rootProject.file('../mpparty-common/src/main/java')    // 一起听共用源码
        ]
        if (modernUiEnabled) {
            java.srcDirs += rootProject.file('external/modernui/java') // ModernUI 版 HUD 设置面板
        }
        resources.srcDirs = [
                'src/main/resources',                                  // fabric.mod.json / accesswidener / mixins
                rootProject.file('src/main/resources')                 // assets、字体、纹理
        ]
    }
    test {
        java.srcDirs = [rootProject.file('src/test/java')]
    }
}

// repo.maven.apache.org 在本机既不能直连（connect timeout），走 7890 代理时 Gradle 侧
// 也会 "Remote host terminated the handshake"（curl 同一 URL 走代理却是 200，原因未查明）。
// 阿里云公共仓库直连可用且已实测含 org.lwjgl:3.3.1 全部 classifier，故把所有
// Maven Central 仓库（含 Loom 自己注入的 mavenCentral()）统一改写到阿里云。
def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org', 'repo.maven.org'] as Set
def retargetCentral = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url != null && centralHosts.contains(repo.url.host)) {
        repo.url = 'https://maven.aliyun.com/repository/public'
    }
}
repositories.all(retargetCentral)
buildscript.repositories.all(retargetCentral)

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/google' }
    // libs/ 里的三个本地 jar 必须以「模块」形式出现，否则 Loom 的 include（Jar-in-Jar）
    // 会报 "not a module component and has no capabilities"（file 依赖没有坐标）。
    // flatDir 按 <name>-<version>.jar 匹配，group 任意。
    flatDir { dirs rootProject.file('libs') }

    // ==================== ModernUI 的编译期构件（社区分支 mVUS）====================
    // 上游只发到 26.1.2 / 1.21.8 那一代，1.21.9~11 只有 Tealeste 的 mVUS 分支有构建，
    // 而它**不进 Maven**，只挂在 GitHub Releases 上。这里用 ivy 仓库把 release 的资源名直接映射出来：
    // 下载与缓存都交给 Gradle（第一次之后离线可用）、仓库里不躺 24MB 第三方二进制，
    // 而且它是以「模块」形式出现的 —— Loom 会按本树的 mojmap 把 jar 里的 intermediary 引用重映射一遍，
    // ActionCenterTab 里那个 MuiModApi.OnScreenChangeListener#onScreenChange(Screen, Screen) 才编得过。
    // 拉不到（没网、被墙、分支改版）就 -PskipModernUi=true，代价只是这一棵树没有面板。
    if (modernUiEnabled) {
        ivy {
            name 'ModernUI mVUS (GitHub Releases)'
            url 'https://github.com/Tealeste/ModernUI-MC-mVUS/releases/download/'
            patternLayout {
                // [revision] 既是 release 的 tag，也是资源名里版本那一段：
                // 3.12.0.5-build.4 -> .../download/3.12.0.5-build.4/ModernUI-MC-3.12.0.5-build.4+mc1.21.11-fabric.jar
                artifact '[revision]/[module]-[revision]+mc1.21.11-fabric.[ext]'
            }
            metadataSources { artifact() }
            content { includeGroup 'mvus.icyllis.modernui' }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 共享源码统一用 Mojang 官方名（mojmap），这样同一份 src/ 也能编进 NeoForge 侧。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Loom 的 include（Jar-in-Jar）：Loader 为每个嵌套 jar 建独立的类加载视图，
    // 天然避免与 MC / 其它 mod 自带库撞版本。NeoForge 侧没有等价机制，
    // 那边用 shadow 把同一批库直接塞进 jar（见 neoforge/build.gradle）。
    implementation include('com.google.zxing:core:3.5.3')
    implementation include('org.mozilla:rhino:1.7.15')
    implementation include('com.google.javascript:closure-compiler:v20240317')
    implementation include('com.google.code.gson:gson:2.11.0')
    implementation include('net.java.dev.jna:jna:5.14.0')
    implementation include('net.java.dev.jna:jna-platform:5.14.0')
    implementation include('muoniumplayer.libs:music-api:0.1.1')
    implementation include('muoniumplayer.libs:zstd-jni:1.5.6-9-forge189')

    // ==================== Skija（渲染层）====================
    // Kotlin 运行时由 Fabric Language Kotlin 统一提供，不再随本 mod 打包。
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    implementation include('io.github.humbleui:skija-shared:0.143.17')
    implementation include('io.github.humbleui:types:0.2.0')
    implementation include("io.github.humbleui:skija-" + project.skija_natives + ":0.143.17")
    compileOnly 'org.jetbrains:annotations:20.1.0'

    // ==================== ModernUI（HUD 设置面板的可选外部渲染层）====================
    // 只 compileOnly：成品 jar 里不含 ModernUI 一个字节，玩家装了才生效、没装零影响，
    // 也满足它的 LGPL-3.0（库必须能被用户单独替换，见 docs/接入ModernUI可行性-HUD设置面板.md §四）。
    // mVUS 的包是自足的（framework 与 mc 两侧类都在同一个 jar 里），所以不像 1.21.1 那样
    // 再补 modernui-core / Markflow —— 而且 core 在 Maven Central 上根本没有 3.12.0。
    if (modernUiEnabled) {
        modCompileOnly 'mvus.icyllis.modernui:ModernUI-MC:3.12.0.5-build.4'
    }

    // 离线探针（不需要 GL / 不需要启动客户端就能跑的断言）。
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_min_version', project.loader_min_version
    inputs.property 'fabric_language_kotlin_version', project.fabric_language_kotlin_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'loader_min_version': project.loader_min_version,
                'fabric_language_kotlin_version': project.fabric_language_kotlin_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // 源码含中文注释与字符串字面量，默认 GBK 会破坏 UI/歌词文案。
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
    // 移植期间需要一次看到全部错误，javac 默认只报 100 条。
    it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// 移植期辅助：把编译类路径导出到文件，便于用 javap 实测 API 签名（禁止凭记忆写 API）。
tasks.register('dumpCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def cp = sourceSets.main.compileClasspath
    outputs.file(out)
    doLast {
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = cp.asPath
    }
}
