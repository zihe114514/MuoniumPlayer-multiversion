# Gradle
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
# fabric-loom 1.17.19 要求 Gradle 守护进程 JVM >= 21（实测报错原文：Dependency requires at least JVM runtime version 21）。
org.gradle.java.home=C:/Users/24914/.jdks/ms-21.0.12.1

# Fabric Properties
minecraft_version=1.21.11
# 共享源码统一用 Mojang 官方名（mojmap），yarn 不再参与构建：NeoForge 只有 mojmap 一种命名。
# Fabric 侧用 loom.officialMojangMappings()，NeoForge 侧由 ModDevGradle 直接给官方名。
# 开发/编译期用的 Loader。发布出去的 jar 声明的下限是下面的 loader_min_version,不是这个值。
loader_version=0.19.3
# fabric.mod.json 里声明的 Loader 下限,刻意比开发用的版本低,好让老一点的启动器配置也能装上。
# 0.17.3 这个数不是随手写的:fabric-api 0.141.6+1.21.11 自己就 depends fabricloader >=0.17.3,
# 而本 mod 硬依赖 fabric-api,所以再往下放宽也不会真的多支持一个版本,只会把「装不上」
# 变成「装上了但 API 缺失」这种更难排查的失败。
# 本 mod 用到的 Loader 侧能力只有 ClientModInitializer、mixin(minVersion 0.8 / JAVA_21)
# 与 access widener,这些在 0.17.3 上全都齐备。
loader_min_version=0.17.3
# 发布元数据使用的最低 NeoForge 版本；开发构建仍用上面的 neoforge_version。
neoforge_min_version=21.11.0
# Kotlin for Forge 最低支持版本；构建期也用这个版本编译，避免误用更新 API。
kotlinforforge_version=6.0.0
# Fabric 侧 Kotlin 运行时最低支持版本。
fabric_language_kotlin_version=1.13.12+kotlin.2.4.0

# Mod Properties
mod_version=1.8.0
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
fabric_version=0.141.6+1.21.11
# 代理（用户指定 127.0.0.1:7890）：maven.fabricmc.net / Mojang libraries 直连不稳。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# libraries.minecraft.net 走代理实测 TLS 握手被中断（Recv failure: Connection was aborted），直连 200。
# maven.minecraftforge.net / maven.neoforged.net 也必须直连：走 7890 代理时 curl -I 三次里
# 有两次是 000（连接被中断），直连稳定 200 且约 1s。走代理会让 :forge:createMinecraftArtifacts
# 抽风式报 "Remote host terminated the handshake"。
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io

# 显式登记本机 JDK，避免 toolchain 自动探测失败。
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-17,C:/Users/24914/.jdks/ms-21.0.12.1

# Skija 原生库平台。开发期只打本机平台以保持构建速度；
# 发布时改成同时声明四个（windows-x64 / linux-x64 / macos-x64 / macos-arm64）。
skija_natives=windows-x64

# ==================== NeoForge ====================
# 21.11.45 是 1.21.11 线的最新 release（maven.neoforged.net/releases/net/neoforged/neoforge）。
neoforge_version=21.11.45
