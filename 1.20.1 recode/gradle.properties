# Gradle
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
# fabric-loom 1.17.19 要求 Gradle 守护进程 JVM >= 21（实测报错原文：Dependency requires at least JVM runtime version 21）。
org.gradle.java.home=C:/Users/24914/.jdks/ms-21.0.12.1

# Fabric Properties
minecraft_version=1.20.1
# 开发/编译期使用的 Loader 版本（保持较新，仅影响本地 runClient 与编译类路径）。
loader_version=0.19.3
# 运行期最低要求，写入 fabric.mod.json 的 depends.fabricloader。
# 代码不直接调用 net.fabricmc.loader API，mixin 只要求 0.8 / JAVA_17，故可放宽到 0.18.2。
loader_min_version=0.18.2

# Mod Properties
mod_version=1.4.4
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
fabric_version=0.92.11+1.20.1
# Forge 侧（ModDevGradle 的 legacyforge 插件）。47.4.0 是 1.20.1 线的最后一个推荐版本。
forge_version=1.20.1-47.4.0
# 代理（用户指定 127.0.0.1:7890）：maven.fabricmc.net / Mojang libraries 直连不稳。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# 走 7890 代理时 Gradle 侧偶发 "Remote host terminated the handshake"（curl 同一 URL 走代理是 200），
# 限制 JVM 提议的 TLS 版本能显著降低复现率。
# 但**不能只留 TLSv1.2**：maven.minecraftforge.net（只有 1.20.1 这一版要用它取
# forge-1.20.1-47.4.0-userdev.jar）会直接拒绝纯 1.2 的 ClientHello，报错原文是
#   The server may not support the client's requested TLS protocol versions: (TLSv1.2)
#     > Remote host terminated the handshake
# 于是 :forge:createMinecraftArtifacts 稳定失败。两个都列出来即可，1.3 优先。
systemProp.https.protocols=TLSv1.3,TLSv1.2
# libraries.minecraft.net 走代理实测 TLS 握手被中断（Recv failure: Connection was aborted），直连 200。
# maven.minecraftforge.net / maven.neoforged.net 也必须直连：走 7890 代理时 curl -I 三次里
# 有两次是 000（连接被中断），直连稳定 200 且约 1s。走代理会让 :forge:createMinecraftArtifacts
# 抽风式报 "Remote host terminated the handshake"。
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net

# 显式登记本机 JDK，避免 toolchain 自动探测失败。
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-17,C:/Users/24914/.jdks/ms-21.0.12.1

# Skija 原生库平台。开发期只打本机平台以保持构建速度；
# 发布时改成同时声明四个（windows-x64 / linux-x64 / macos-x64 / macos-arm64）。
skija_natives=windows-x64
