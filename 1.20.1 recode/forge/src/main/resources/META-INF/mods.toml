# Forge 侧的 mod 元数据，对应 Fabric 的 fabric.mod.json。
# 1.20.1 的文件名是 META-INF/mods.toml（NeoForge 1.20.2+ 才改叫 neoforge.mods.toml）。
modLoader = "javafml"
loaderVersion = "[47,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/zihe114514/MuoniumPlayer-multiversion/issues"

[[mods]]
modId = "muonium"
version = "${version}"
displayName = "MuoniumPlayer"
authors = "云杉, 心事抱抱, N0ne, eyz2021"
description = '''
Minecraft music client mod: 8 sources (NetEase / QQ / KuGou / Bilibili / Qishui / YouTube Music / Spotify / GD), word-by-word lyrics, Dynamic Island, Automix crossfade, listen-together rooms. Client-only.
'''
displayURL = "https://melodifymc.cc.cd/"
logoFile = "assets/muonium/icon.png"

# 客户端专用：装到服务端上不需要、也不应该加载。
[[dependencies.muonium]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_min_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.muonium]]
    modId = "kotlinforforge"
    mandatory = true
    versionRange = "[${kotlinforforge_version},)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.muonium]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "CLIENT"

# 压原版音乐等客户端修补用的 mixin（与 Fabric 侧共用同一份 com.muoniumplayer.mixin 源码）。
# Forge 运行期本来就是官方名（本仓库统一 mojmap），不需要 refmap。
[[mixins]]
    config = "muonium.mixins.json"
