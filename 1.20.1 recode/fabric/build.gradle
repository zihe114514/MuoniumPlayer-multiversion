plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
}

base {
    // 产物名带上 Minecraft 版本，这样四个版本工程的 8 个 jar 平铺到一个 dist/ 里不会撞名，
    // 用户下载后也一眼看出这个 jar 是给哪个版本、哪个加载器的：MuoniumPlayer-<mc>-<loader>-<modver>.jar
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-fabric"
}

loom {
    // 客户端专用 mod（原 Forge 侧 clientSideOnly = true）：
    // 不启用 splitEnvironmentSourceSets，全部代码留在 src/main，与 1.8.9 源树目录结构一一对应。
    accessWidenerPath = file('src/main/resources/muoniumplayer.accesswidener')

    // 移植期验收辅助：设了 MU_QUICKPLAY=<存档文件夹名> 就直接进存档。
    runs {
        client {
            def quickPlay = System.getenv('MU_QUICKPLAY')
            if (quickPlay) {
                programArgs '--quickPlaySingleplayer', quickPlay
            }
        }
    }
}

// 共享代码与资源在上一级目录，两个加载器子工程各自挂同一份，绝不复制。
//
// ModernUI 面板实现在 external/modernui/java —— 与 1.21.1 / 1.21.11 两棵树同构，但源码不通用：
// 本树编译期用的是上游 1.20.1-3.12.0.1，跟的是 ModernUI 3.12 那一代 API（与 1.21.11 那棵树同代，
// 差异只有 ClampingScrollView.setMaxWidth 与「没有公开的取 drawable 入口」两处，都写在调用点注释里）。
// 共享 src 一旦 import icyllis.modernui 就会把另外三棵树一起编挂，所以绝不能挪进 src/main/java；
// HudExternalUiStaticTest 有断言守这件事。
def modernUiEnabled = !project.hasProperty('skipModernUi')

sourceSets {
    main {
        java.srcDirs = [
                'src/main/java',                                       // Fabric 外壳
                rootProject.file('src/main/java'),                     // 共享主体
                rootProject.file('../mpparty-common/src/main/java')    // 一起听共用源码
        ]
        if (modernUiEnabled) {
            java.srcDirs += rootProject.file('external/modernui/java') // ModernUI 版 HUD 设置面板
        }
        resources.srcDirs = [
                'src/main/resources',                                  // fabric.mod.json / accesswidener / mixins
                rootProject.file('src/main/resources')                 // assets、字体、纹理
        ]
    }
    test {
        java.srcDirs = [rootProject.file('src/test/java')]
    }
}

// repo.maven.apache.org 在本机既不能直连（connect timeout），走 7890 代理时 Gradle 侧
// 也会 "Remote host terminated the handshake"（curl 同一 URL 走代理却是 200，原因未查明）。
// 阿里云公共仓库直连可用且已实测含 org.lwjgl:3.3.1 全部 classifier，故把所有
// Maven Central 仓库（含 Loom 自己注入的 mavenCentral()）统一改写到阿里云。
def centralHosts = ['repo.maven.apache.org', 'repo1.maven.org', 'repo.maven.org'] as Set
def retargetCentral = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository
            && repo.url != null && centralHosts.contains(repo.url.host)) {
        repo.url = 'https://maven.aliyun.com/repository/public'
    }
}
// all() 会同时覆盖已注册与后续注册的仓库。
repositories.all(retargetCentral)
buildscript.repositories.all(retargetCentral)

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/google' }
    // libs/ 里的三个本地 jar 必须以「模块」形式出现，否则 Loom 的 include（Jar-in-Jar）
    // 会报 "not a module component and has no capabilities"（file 依赖没有坐标）。
    // flatDir 按 <name>-<version>.jar 匹配，group 任意。
    flatDir { dirs rootProject.file('libs') }

    // ==================== ModernUI 的编译期构件（上游 1.20.1 那一版）====================
    // maven.izzel.io 上确实有 ModernUI-Fabric:1.20.1-3.12.0.1，但那是 807KB 的「只有 MC 侧类」的壳，
    // 框架类在 dev.icyllis:modernui-core 里 —— 而 core 在 Maven Central 上只发了 3.13.0，没有 3.12.0。
    // 所以这一棵树要的是带 core 的那份 universal jar（24MB）。它有两个家：Modrinth CDN 与上游
    // GitHub Releases（BloCamLimb/ModernUI-MC，tag 3.12.0.4 里放着 1.20.1 的 fabric 与 forge 两份）。
    // 这里选 GitHub：cdn.modrinth.com 会 307 跳到签名临时地址，Gradle 那侧拿不到（实测解析失败），
    // 而 GitHub 的 release 资源重定向 Gradle 处理得好 —— 1.21.11 那棵树用同形状的 ivy 块已经编过。
    // 好处还是那三条：下载与缓存交给 Gradle（第一次之后离线可用）、仓库里不留第三方二进制、
    // 以「模块」形式出现所以 Loom 会按本树的 mojmap 重映射它（ActionCenterTab 里那个
    // onScreenChange(Screen, Screen) 才编得过）。拉不到就 -PskipModernUi=true，代价只是这棵树没有面板。
    if (modernUiEnabled) {
        ivy {
            name 'ModernUI universal (GitHub Releases)'
            url 'https://github.com/BloCamLimb/ModernUI-MC/releases/download/'
            patternLayout {
                // [revision] 是 release 的 tag，资源名整段写死：
                // 3.12.0.4 -> .../download/3.12.0.4/ModernUI-Fabric-1.20.1-3.12.0.1-universal.jar
                artifact '[revision]/[module]-1.20.1-3.12.0.1-universal.[ext]'
            }
            metadataSources { artifact() }
            content { includeGroup 'upstream.icyllis.modernui' }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 共享源码统一用 Mojang 官方名（mojmap），这样同一份 src/ 也能编进 Forge 侧。
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 与 1.8.9 build.gradle 的 compileOnly lombok 一致（@Data/@Builder/@UtilityClass/@SneakyThrows）。
    // Gradle 9 需要显式声明 annotationProcessor，否则注解不展开。
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // 以下对应 1.8.9 的 shade 配置。
    // 1.8.9 用 shadow 打 fat-jar + relocation；Fabric 的等价手段是 Loom 的 include（Jar-in-Jar），
    // 由 Loader 为每个嵌套 jar 建独立的类加载视图，天然避免与 MC / 其它 mod 自带库撞版本，
    // 因此不再需要手工 relocate 到 repackage/。
    // 实测 MC 1.20.1 自身已提供 guava / commons-lang3 / commons-io / httpclient / log4j / asm，
    // 故这些不重复打包（见 build/bundle-deps.txt 的解析结果）。
    implementation include('com.google.zxing:core:3.5.3')
    implementation include('org.mozilla:rhino:1.7.15')
    implementation include('com.google.javascript:closure-compiler:v20240317')
    // MC 1.20.1 自带 gson 2.10，而 Cadence 相关代码按 2.11 API 编写，必须自带 2.11。
    implementation include('com.google.code.gson:gson:2.11.0')
    // JNA：DeviceIdGenerator 读注册表 CPU 名 + CursorUtils 切光标。
    implementation include('net.java.dev.jna:jna:5.14.0')
    implementation include('net.java.dev.jna:jna-platform:5.14.0')
    // 对应 libs/ 下的三个本地 jar（Cadence 音源 SDK / zstd / Kotlin 运行时）。
    implementation include('muoniumplayer.libs:music-api:0.1.1')
    implementation include('muoniumplayer.libs:zstd-jni:1.5.6-9-forge189')

    // ==================== Skija（渲染层重写）====================
    // Skia 的 Java 绑定。渲染层重写后，文字整形/光栅、圆角、裁剪、模糊、渐变、阴影
    // 全部由 Skia 提供，替代原先的 compat/gl 固定管线模拟 + 自写 GLSL + AWT 字形管线。
    //
    // 三个 artifact 的分工：
    //   skija-shared        纯 Java 绑定层（0.4 MB）
    //   types               Rect / RRect / Point 等值类型，skija-shared 的编译期依赖
    //   skija-<os>-<arch>   原生库 + ICU 数据（Windows x64 约 10.6 MB 压缩 / 23 MB 解压）
    //
    // 原生库当前只打包开发机平台。发布前需要把四个平台都加上（合计约 46 MB），
    // 见 gradle.properties 的 skija_natives；SkijaNatives 会按 os.name/os.arch 自动挑资源路径。
    // Kotlin 运行时由 Fabric Language Kotlin 统一提供，不再随本 mod 打包。
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    implementation include('io.github.humbleui:skija-shared:0.143.17')
    implementation include('io.github.humbleui:types:0.2.0')
    implementation include("io.github.humbleui:skija-" + project.skija_natives + ":0.143.17")
    // skija-shared 的 provided 依赖，只在编译期需要（@Nullable 之类）。
    compileOnly 'org.jetbrains:annotations:20.1.0'

    // ==================== ModernUI（HUD 设置面板的可选外部渲染层）====================
    // 只 compileOnly：成品 jar 里不含 ModernUI 一个字节，玩家装了才生效、没装零影响，
    // 也满足它的 LGPL-3.0（库必须能被用户单独替换，见 docs/接入ModernUI可行性-HUD设置面板.md §四）。
    // 直链与「为什么不走 maven.izzel.io」都写在 repositories 里那个 ivy 块的注释上。
    // 这一份 universal jar 自带 framework 与 mc 两侧全部类，所以不像 1.21.1 那样再补 core / Markflow。
    if (modernUiEnabled) {
        modCompileOnly 'upstream.icyllis.modernui:ModernUI-Fabric:3.12.0.4'
    }

    // 离线探针（不需要 GL / 不需要启动客户端就能跑的断言）。
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_min_version', project.loader_min_version
    inputs.property 'fabric_language_kotlin_version', project.fabric_language_kotlin_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version,
                'loader_min_version': project.loader_min_version,
                'fabric_language_kotlin_version': project.fabric_language_kotlin_version
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // 源码含中文注释与字符串字面量，默认 GBK 会破坏 UI/歌词文案。
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
    // 移植期间需要一次看到全部错误，javac 默认只报 100 条。
    it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

java {
    // 守护进程跑在 JDK 21（Loom 1.17 的硬要求），但编译与 runClient 必须用 17：
    // 1.20.1 客户端的目标运行时是 Java 17。
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// 移植期辅助：把编译类路径导出到文件，便于用 javap 实测官方名类/方法签名（禁止凭记忆写 API）。
tasks.register('dumpCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def cp = sourceSets.main.compileClasspath
    outputs.file(out)
    doLast {
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = cp.asPath
    }
}

// 移植期辅助：列出需要打进最终 jar 的第三方依赖（含传递依赖），用于确定 include 清单。
tasks.register('dumpBundleDeps') {
    def out = layout.buildDirectory.file('bundle-deps.txt')
    def cfg = configurations.runtimeClasspath
    outputs.file(out)
    doLast {
        def lines = []
        cfg.resolvedConfiguration.resolvedArtifacts.each { a ->
            def id = a.moduleVersion.id
            lines << "${id.group}:${id.name}:${id.version}"
        }
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = lines.sort().unique().join('\n')
    }
}


// ==================== 一起听（服务端房间 / mpsync）====================
// 客户端侧的房间协议、房间状态与播放桥接放在 ../mpparty-common，四个版本工程共用同一份源码；
// 版本差异只留在各自的 src/main/java/com/muoniumplayer/party/net/（通道 API 与聊天/UUID 的类名）。
// 与 F:/donked/新建文件夹 (3) 下的服务端 mod 是同一套线协议，因此本播放器与 Melodify
// 可以在同一个房间里一起听。
// （mpparty-common 已在上面的 sourceSets 里声明，不再追加。）
