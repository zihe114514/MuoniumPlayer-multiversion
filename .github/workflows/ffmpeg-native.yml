name: FFmpeg audio and video-cover native candidates (Windows, Android arm64, Linux x64)

# Three source targets only; Windows embedded and other ABIs on demand. No publishing/device claim.
"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "native/ffmpeg/**"
      - ".github/workflows/ffmpeg-native.yml"

permissions:
  contents: read

concurrency:
  group: ffmpeg-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NATIVE_JOBS: "4"

jobs:
  fixtures:
    name: Generate local test media
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate recipe guards and source-target plans
        run: |
          python3 native/ffmpeg/test_recipe.py
          for platform in windows-x86_64 linux-x86_64 android-arm64; do
            python3 native/ffmpeg/recipe.py plan --platform "$platform" > /dev/null
          done
      - name: Install test-only media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg openssl
      - name: Generate clean codec, HLS and TLS fixtures
        run: python3 native/ffmpeg/smoke.py fixtures .scratch/ffmpeg-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-test-media
          path: .scratch/ffmpeg-fixtures
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  compile:
    name: Compile ${{ matrix.platform }}
    needs: fixtures
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            smoke: true
            artifact: ffmpeg-native-linux-x86_64
          - platform: windows-x86_64
            runner: ubuntu-22.04
            smoke: false
            artifact: ffmpeg-build-windows-x86_64
          - platform: android-arm64
            runner: ubuntu-22.04
            smoke: false
            artifact: ffmpeg-native-android-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux compiler tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config perl nasm xz-utils binutils
      - name: Install Windows cross compiler
        if: matrix.platform == 'windows-x86_64'
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
      - name: Install locked Android NDK
        if: startsWith(matrix.platform, 'android-')
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build exact-release audio and video-cover candidate
        run: |
          python3 native/ffmpeg/recipe.py build --platform '${{ matrix.platform }}' --work '.scratch/native-${{ matrix.platform }}'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.smoke
        with:
          name: ffmpeg-test-media
          path: .scratch/ffmpeg-fixtures
      - name: Smoke JNI, codecs, HTTP, HTTPS and AES-128 HLS
        if: matrix.smoke
        run: |
          python3 native/ffmpeg/smoke.py test --candidate '.scratch/native-${{ matrix.platform }}/ffmpeg-audio-candidate-${{ matrix.platform }}.jar' --fixtures .scratch/ffmpeg-fixtures --work '.scratch/smoke-${{ matrix.platform }}'
      - name: Upload internal platform candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: .scratch/native-${{ matrix.platform }}/ffmpeg-audio-candidate-${{ matrix.platform }}.jar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve compiler/configuration/runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-evidence-${{ matrix.platform }}
          path: |
            .scratch/native-${{ matrix.platform }}/build.log
            .scratch/native-${{ matrix.platform }}/configure-flags.txt
            .scratch/native-${{ matrix.platform }}/dependencies.txt
            .scratch/native-${{ matrix.platform }}/sources.lock.json
            .scratch/native-${{ matrix.platform }}/capabilities.json
            .scratch/native-${{ matrix.platform }}/ffmpeg-build/ffbuild/config.log
            .scratch/native-${{ matrix.platform }}/ffmpeg-build/ffbuild/config.mak
            .scratch/smoke-${{ matrix.platform }}/*.txt
            .scratch/smoke-${{ matrix.platform }}/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  windows-smoke:
    name: Smoke Windows JNI candidate
    needs: compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-build-windows-x86_64
          path: .scratch/windows-native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-test-media
          path: .scratch/ffmpeg-fixtures
      - name: Test the cross-compiled Windows artifact
        run: |
          python native/ffmpeg/smoke.py test --candidate .scratch/windows-native/ffmpeg-audio-candidate-windows-x86_64.jar --fixtures .scratch/ffmpeg-fixtures --work .scratch/smoke-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-native-windows-x86_64
          path: .scratch/windows-native/ffmpeg-audio-candidate-windows-x86_64.jar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-evidence-windows-runtime
          path: .scratch/smoke-windows
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
