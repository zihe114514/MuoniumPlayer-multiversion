name: Build MusicParty (Paper 1.21.11, Folia-ready)

on:
  push:
    branches: [ main ]
    paths:
      - 'mpsync-paper-1.21.11/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mpsync-paper-1.21.11/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mpsync-paper-1.21.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MusicParty-1.21.11
          path: mpsync-paper-1.21.11/target/*.jar
          if-no-files-found: error
