# RenderType$CompositeRenderType 在 1.21.10 官方 jar 里是包私有（javap 实测
# flags 0x0030），只有 net.minecraft.client.renderer 包内能引用。
#
# 3D 歌词晕格要自建加色 RenderType（beacon_beam 着色器 + BlendFunction.LIGHTNING），
# 走的是四参 RenderType.create —— 它的返回类型就是这个内部类。而 Mixin 的
# @Invoker 按 MemberInfo 全描述符匹配目标方法（返回值也参与比较，见
# MemberInfo.matches 的 desc.equals），所以 accessor 的方法签名必须逐字节写成
#    (String,int,RenderPipeline,RenderType$CompositeState)L...$CompositeRenderType;
# 写父类 RenderType 会匹配不到、apply 阶段抛 InvalidAccessorException（issue #16）。
#
# fabric 侧不需要这条等价条目：loom 的 named jar 把这个类重映射成了
# ACC_PUBLIC（实测 0x0031），javac 直接放行。NeoForge 的 merged jar 保持
# 官方可见性，所以只有这个壳要 AT。类条目不受 SRG 名影响，直接写 mojmap 名。
public net.minecraft.client.renderer.RenderType$CompositeRenderType
