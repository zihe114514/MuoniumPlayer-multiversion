# Gradle
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
# fabric-loom 要求 Gradle 守护进程 JVM >= 21；26.3 的客户端目标运行时是 Java 25
# （version json 的 javaVersion.majorVersion = 25，component = java-runtime-epsilon，
# 与 26.2 同一档），所以守护进程 / 编译 / runClient 统一用 JDK 25 ——
# JDK 21 连 Minecraft 的 class 都读不了。
org.gradle.java.home=C:/Users/24914/.jdks/temurin-25.0.4.1

# Fabric Properties
# 26.x 的官方 jar 不再混淆：version json 里只有 client/server 两个 download，没有 client_mappings，
# Yarn 与 intermediary 都停在 1.21.11（meta 里 26.3 的 intermediary 仍是占位值）。
# 因此没有 yarn_mappings 这一项：源码直接写官方类名，Loom 不做重映射。
minecraft_version=26.3
# 开发/编译期用的 Loader。发布出去的 jar 声明的下限是下面的 loader_min_version,不是这个值。
loader_version=0.19.5
# fabric.mod.json 里声明的 Loader 下限,刻意比开发用的版本低,好让老一点的启动器配置也能装上。
# 0.19.3 这个数不是随手写的:fabric-api 0.161.0+26.3 自己就 depends fabricloader >=0.19.3
# （从它的 fabric.mod.json 里读出来的）,而本 mod 硬依赖 fabric-api,
# 所以再往下放宽也不会真的多支持一个版本,只会把「装不上」变成「装上了但 API 缺失」这种更难排查的失败。
# 本 mod 用到的 Loader 侧能力只有 ClientModInitializer 与 mixin(minVersion 0.8 / JAVA_25),
# 这些在 0.19.3 上全都齐备。
loader_min_version=0.19.3
# 发布元数据使用的最低 NeoForge 版本；开发构建仍用下面的 neoforge_version。
# 26.3 线目前只有 -beta 序列（26.3.0.0-beta 起），还没有 26.2.0.72 那样的稳定版，
# 所以下限写成 26.3.0.0-beta。等稳定版出来，这一行和 neoforge_version 一起改掉。
neoforge_min_version=26.3.0.0-beta
# Kotlin for Forge 最低支持版本；构建期也用这个版本编译，避免误用更新 API。
kotlinforforge_version=6.3.0
# Fabric 侧 Kotlin 运行时最低支持版本。
fabric_language_kotlin_version=1.13.12+kotlin.2.4.0

# Mod Properties
mod_version=1.9.0
maven_group=com.muoniumplayer
archives_base_name=MuoniumPlayer

# Dependencies
fabric_version=0.161.0+26.3
# NeoForge 侧（ModDevGradle）。26.3 线目前只有 -beta 序列，最新是 26.3.0.16-beta。
# 换成它不是为了解决「13-beta 编不过」——那个报错（recompile 原版 HolderSet.java 时报
# contents() 弱化访问权限）出在 ModDevGradle 2.0.144 太旧，13/16 两版都会中，
# 上游 issue neoforged/NeoForge#3518 的答复是升级插件到 2.0.147；插件版本写在
# neoforge/build.gradle 的 plugins 块里。
# 与 26.2 用 26.2.0.72 稳定版不同，这条链子还在 beta 阶段，出包给用户的 NeoForge 版本时要说清楚。
neoforge_version=26.3.0.16-beta
# 代理（用户指定 127.0.0.1:7890）：maven.fabricmc.net / Mojang libraries 直连不稳。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# libraries.minecraft.net 走代理实测 TLS 握手被中断（Recv failure: Connection was aborted），直连 200。
# maven.minecraftforge.net / maven.neoforged.net 也必须直连：走 7890 代理时 curl -I 三次里
# 有两次是 000（连接被中断），直连稳定 200 且约 1s。走代理会让 :forge:createMinecraftArtifacts
# 抽风式报 "Remote host terminated the handshake"。
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.mojang.com|libraries.minecraft.net|maven.fabricmc.net|*.aliyun.com|mirrors.cloud.tencent.com|maven.minecraftforge.net|maven.neoforged.net|thedarkcolour.github.io

# 显式登记本机 JDK，避免 toolchain 自动探测失败。
org.gradle.java.installations.paths=C:/Users/24914/.jdks/temurin-25.0.4.1,C:/Users/24914/.jdks/ms-21.0.12.1

# Skija 原生库平台。开发期只打本机平台以保持构建速度；
# 发布时改成同时声明四个（windows-x64 / linux-x64 / macos-x64 / macos-arm64）。
skija_natives=windows-x64
